# ================================================
# Stash 专用配置（iPhone / iPad / Mac）
# ⚠️ 本文件由 scripts/make_stash.py 根据 flclash-config.yaml 自动生成，请不要直接修改
# 用法：Stash 里用 URL 导入本文件（自动更新），
# 再导入覆写 stash-subs.stoverride 填入机场订阅链接，见 README「Stash 设置」
# 与 FlClash 版的区别：没有 AdsPower 专用端口（7891），安卓包名规则在 Stash 上不生效
# ================================================

mode: rule
log-level: info
ipv6: false
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - +.msftconnecttest.com
  - +.msftncsi.com
  - time.*.com
  - +.ntp.org
  - +.mcc310.pub.3gppnetwork.org
  - +.mcc311.pub.3gppnetwork.org
  - +.mcc312.pub.3gppnetwork.org
  - +.mcc313.pub.3gppnetwork.org
  - +.mcc314.pub.3gppnetwork.org
  - +.mcc315.pub.3gppnetwork.org
  - +.mcc316.pub.3gppnetwork.org
  default-nameserver:
  - 1.1.1.1
  - 8.8.8.8
  nameserver:
  - https://1.1.1.1/dns-query
  - https://dns.google/dns-query
proxy-providers:
  TAG-GLOBAL:
    url: 这里粘贴TAG-GLOBAL的订阅链接
    path: ./providers/tag-global.yaml
    interval: 86400
  EdNovas:
    url: 这里粘贴EdNovas的订阅链接
    path: ./providers/ednovas.yaml
    interval: 86400
proxy-groups:
- name: 节点选择
  type: select
  proxies:
  - 自动选择
  - 香港节点
  - 台湾节点
  - 日本节点
  - 新加坡节点
  - 韩国节点
  - 美国节点
  - 英国节点
  - 德国节点
  - 中国大陆节点
  - 全部节点
  - TAG-GLOBAL
  - EdNovas
  - DIRECT
  icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
- type: url-test
  use: &id001
  - TAG-GLOBAL
  - EdNovas
  interval: 300
  tolerance: 50
  name: 自动选择
  lazy: true
  icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
