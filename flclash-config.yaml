# ================================================
# FlClash / mihomo 配置文件
# 使用前只需改一处：proxy-providers 里填上各个机场的订阅链接（支持多个）
# ================================================

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

# ---------- 规则数据库（GEOSITE / GEOIP）----------
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"

# ---------- DNS（用加密 DNS，防止本地运营商污染）----------
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.ntp.org"
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query

# ---------- 机场订阅（★ 改这里）----------
# 有几个机场就留几个，把 url 换成各自的订阅链接；用不到的整段删掉
# additional-prefix 会在节点名前加上机场名，方便在「全部节点」里区分
proxy-providers:
  机场1:
    type: http
    url: "这里粘贴机场1的订阅链接"
    path: ./providers/airport1.yaml
    interval: 86400
    override:
      additional-prefix: "[机场1] "
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

  机场2:
    type: http
    url: "这里粘贴机场2的订阅链接"
    path: ./providers/airport2.yaml
    interval: 86400
    override:
      additional-prefix: "[机场2] "
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

  机场3:
    type: http
    url: "这里粘贴机场3的订阅链接"
    path: ./providers/airport3.yaml
    interval: 86400
    override:
      additional-prefix: "[机场3] "
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

# ---------- 公共模板 ----------
auto-test: &auto
  type: url-test
  use: [机场1, 机场2, 机场3]  # 删掉机场时这里也要同步删
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50

# ---------- 策略组 ----------
proxy-groups:
  # 总开关
  - name: 节点选择
    type: select
    proxies: [自动选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点, 英国节点, 德国节点, 中国大陆节点, 全部节点, 机场1, 机场2, 机场3, DIRECT]

  - name: 自动选择
    <<: *auto

  - name: 全部节点
    type: select
    use: [机场1, 机场2, 机场3]  # 删掉机场时这里也要同步删

  # 按机场分组（只看某一个机场的节点）
  - name: 机场1
    type: select
    use: [机场1]
  - name: 机场2
    type: select
    use: [机场2]
  - name: 机场3
    type: select
    use: [机场3]

  # 各服务分流（每个都可以在 FlClash 里单独切节点，所有分组都能选直连）
  - name: Muse
    type: select
    proxies: [美国节点, 节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 英国节点, 德国节点, 中国大陆节点, 全部节点, DIRECT]

  - name: 流媒体
    type: select
    proxies: [节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点, 英国节点, 德国节点, 中国大陆节点, 全部节点, DIRECT]

  - name: TikTok
    type: select
    proxies: [节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点, 英国节点, 德国节点, 中国大陆节点, 全部节点, DIRECT]

  - name: PayPal
    type: select
    proxies: [美国节点, 节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 英国节点, 德国节点, 中国大陆节点, 全部节点, DIRECT]

  - name: Wise
    type: select
    proxies: [节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点, 英国节点, 德国节点, 中国大陆节点, 全部节点, DIRECT]

  - name: Blued
    type: select
    proxies: [香港节点, 节点选择, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点, 英国节点, 德国节点, 中国大陆节点, 全部节点, DIRECT]

  - name: LGBT应用
    type: select
    proxies: [节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点, 英国节点, 德国节点, 中国大陆节点, 全部节点, DIRECT]

  - name: LINE
    type: select
    proxies: [节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点, 英国节点, 德国节点, 中国大陆节点, 全部节点, DIRECT]

  - name: 微信
    type: select
    proxies: [DIRECT, 中国大陆节点, 节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点, 英国节点, 德国节点, 全部节点]

  - name: 小红书
    type: select
    proxies: [DIRECT, 中国大陆节点, 节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点, 英国节点, 德国节点, 全部节点]

  - name: 抖音
    type: select
    proxies: [DIRECT, 中国大陆节点, 节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点, 英国节点, 德国节点, 全部节点]

  - name: 谷歌服务
    type: select
    proxies: [节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点, 英国节点, 德国节点, 中国大陆节点, 全部节点, DIRECT]

  - name: 苹果服务
    type: select
    proxies: [DIRECT, 节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点, 英国节点, 德国节点, 中国大陆节点, 全部节点]

  - name: 漏网之鱼
    type: select
    proxies: [节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点, 英国节点, 德国节点, 中国大陆节点, 全部节点, DIRECT]

  # 国家/地区（按节点名自动归类，测速选最快）
  - name: 香港节点
    <<: *auto
    filter: "港|HK|Hong Kong|HongKong|🇭🇰"
  - name: 台湾节点
    <<: *auto
    filter: "台|TW|Taiwan|🇹🇼"
  - name: 日本节点
    <<: *auto
    filter: "日本|东京|大阪|JP|Japan|🇯🇵"
  - name: 新加坡节点
    <<: *auto
    filter: "新加坡|狮城|SG|Singapore|🇸🇬"
  - name: 韩国节点
    <<: *auto
    filter: "韩|首尔|KR|Korea|🇰🇷"
  - name: 美国节点
    <<: *auto
    filter: "美国|洛杉矶|圣何塞|西雅图|纽约|US|USA|United States|🇺🇸"
  - name: 英国节点
    <<: *auto
    filter: "英国|伦敦|UK|GB|United Kingdom|🇬🇧"
  - name: 德国节点
    <<: *auto
    filter: "德国|法兰克福|DE|Germany|🇩🇪"
  - name: 中国大陆节点
    <<: *auto
    filter: "中国|大陆|回国|国内|北京|上海|广州|深圳|杭州|成都|CN|China|🇨🇳"
    exclude-filter: "港|台|澳|HK|TW|MO|Hong Kong|Taiwan|Macao|Macau"

