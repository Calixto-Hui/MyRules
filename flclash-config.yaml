# ================================================
# FlClash / mihomo 配置文件
# 使用前只需改一处：proxy-providers 里的 url 换成你的机场订阅链接
# ================================================

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

# ---------- 规则数据库（GEOSITE / GEOIP）----------
geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"

# ---------- DNS（用加密 DNS，防止本地运营商污染）----------
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.ntp.org"
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query

# ---------- 机场订阅（★ 改这里）----------
proxy-providers:
  机场:
    type: http
    url: "这里粘贴你的订阅链接"
    path: ./providers/airport.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

# ---------- 公共模板 ----------
auto-test: &auto
  type: url-test
  use: [机场]
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50

# ---------- 策略组 ----------
proxy-groups:
  # 总开关
  - name: 节点选择
    type: select
    proxies: [自动选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 韩国节点, 美国节点, 英国节点, 德国节点, 全部节点, DIRECT]

  - name: 自动选择
    <<: *auto

  - name: 全部节点
    type: select
    use: [机场]

  # 各服务分流（每个都可以在 FlClash 里单独切节点）
  - name: Muse
    type: select
    proxies: [美国节点, 节点选择, 日本节点, 新加坡节点, 英国节点, 全部节点]

  - name: 流媒体
    type: select
    proxies: [节点选择, 香港节点, 台湾节点, 日本节点, 新加坡节点, 美国节点, 英国节点, 全部节点]

  - name: PayPal
    type: select
    proxies: [美国节点, 节点选择, 香港节点, 英国节点, 全部节点, DIRECT]

  - name: Wise
    type: select
    proxies: [节点选择, 美国节点, 英国节点, 香港节点, 新加坡节点, 全部节点, DIRECT]

  - name: Blued
    type: select
    proxies: [香港节点, 节点选择, 台湾节点, 日本节点, 新加坡节点, 全部节点, DIRECT]

  - name: LGBT应用
    type: select
    proxies: [节点选择, 美国节点, 日本节点, 新加坡节点, 香港节点, 英国节点, 全部节点]

  - name: 谷歌服务
    type: select
    proxies: [节点选择, 美国节点, 日本节点, 新加坡节点, 香港节点, 全部节点, DIRECT]

  - name: 苹果服务
    type: select
    proxies: [DIRECT, 节点选择, 美国节点, 香港节点, 全部节点]

  - name: 漏网之鱼
    type: select
    proxies: [节点选择, DIRECT]

  # 国家/地区（按节点名自动归类，测速选最快）
  - name: 香港节点
    <<: *auto
    filter: "港|HK|Hong Kong|HongKong|🇭🇰"
  - name: 台湾节点
    <<: *auto
    filter: "台|TW|Taiwan|🇹🇼"
  - name: 日本节点
    <<: *auto
    filter: "日本|东京|大阪|JP|Japan|🇯🇵"
  - name: 新加坡节点
    <<: *auto
    filter: "新加坡|狮城|SG|Singapore|🇸🇬"
  - name: 韩国节点
    <<: *auto
    filter: "韩|首尔|KR|Korea|🇰🇷"
  - name: 美国节点
    <<: *auto
    filter: "美国|洛杉矶|圣何塞|西雅图|纽约|US|USA|United States|🇺🇸"
  - name: 英国节点
    <<: *auto
    filter: "英国|伦敦|UK|GB|United Kingdom|🇬🇧"
  - name: 德国节点
    <<: *auto
    filter: "德国|法兰克福|DE|Germany|🇩🇪"

# ---------- 规则集（来自 github.com/kekeke-wang/ClashRules）----------
rule-providers:
  muse:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/kekeke-wang/ClashRules/main/muse.yaml"
    path: ./ruleset/muse.yaml
    interval: 86400
  paypal:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/kekeke-wang/ClashRules/main/paypal.yaml"
    path: ./ruleset/paypal.yaml
    interval: 86400
  wise:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/kekeke-wang/ClashRules/main/wise.yaml"
    path: ./ruleset/wise.yaml
    interval: 86400
  blued:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/kekeke-wang/ClashRules/main/blued.yaml"
    path: ./ruleset/blued.yaml
    interval: 86400
  lgbt:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/kekeke-wang/ClashRules/main/lgbt.yaml"
    path: ./ruleset/lgbt.yaml
    interval: 86400
  streaming:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/kekeke-wang/ClashRules/main/streaming.yaml"
    path: ./ruleset/streaming.yaml
    interval: 86400
  google:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/kekeke-wang/ClashRules/main/google.yaml"
    path: ./ruleset/google.yaml
    interval: 86400
  apple:
    type: http
    behavior: classical
    format: yaml
    url: "https://raw.githubusercontent.com/kekeke-wang/ClashRules/main/apple.yaml"
    path: ./ruleset/apple.yaml
    interval: 86400

# ---------- 分流规则（从上往下匹配，顺序很重要）----------
rules:
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve
  - RULE-SET,muse,Muse
  - RULE-SET,paypal,PayPal
  - RULE-SET,wise,Wise
  - RULE-SET,blued,Blued
  - RULE-SET,lgbt,LGBT应用
  - RULE-SET,streaming,流媒体
  - RULE-SET,google,谷歌服务
  - RULE-SET,apple,苹果服务
  - GEOIP,SA,DIRECT
  - MATCH,漏网之鱼
