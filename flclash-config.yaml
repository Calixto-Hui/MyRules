  - GEOIP,private,DIRECT,no-resolve
  - RULE-SET,muse,Muse
  - RULE-SET,paypal,PayPal
  - RULE-SET,wise,Wise
  - RULE-SET,blued,Blued
  - RULE-SET,lgbt,LGBT应用
  - RULE-SET,wechat,微信
  - RULE-SET,xiaohongshu,小红书
  - RULE-SET,douyin,抖音
  - RULE-SET,line,LINE
  - RULE-SET,tiktok,TikTok
  - RULE-SET,streaming,流媒体
  - RULE-SET,google,谷歌服务  # 含 YouTube
  - RULE-SET,apple,苹果服务
  - GEOIP,SA,DIRECT
  - MATCH,漏网之鱼
